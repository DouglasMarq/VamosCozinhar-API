apiVersion: v1
kind: ConfigMap
metadata:
  name: vamoscozinharapi-config
  namespace: default
data:
  APP_PORT: "8080"
  LOG_LEVEL: "INFO"
  HIKARI_MAX_POOL_SIZE: "5"
  HIKARI_MIN_POOL_IDLE: "1"
  HIKARI_IDLE_TIMEOUT: "300000"
  HIKARI_MAX_LIFETIME: "600000"
  HIKARI_AUTO_COMMIT: "true"
  REDIS_TIMEOUT: "10000"
  REDIS_MAX_ACTIVE: "5"
  REDIS_MAX_IDLE: "5"
  REDIS_MIN_IDLE: "1"
  REDIS_TTL: "3600"
  FLYWAY_ENABLED: "true"

---
apiVersion: v1
kind: Secret
metadata:
  name: vamoscozinharapi-secrets
  namespace: default
type: Opaque
data:
  DB_DATASOURCE: postgresql://localhost:5432/postgres
  DB_USERNAME: postgres
  DB_PASS: postgres
  REDIS_HOST: localhost
  REDIS_PORT: 6379

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vamoscozinharapi
  namespace: default
  labels:
    app: vamoscozinharapi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vamoscozinharapi
  template:
    metadata:
      labels:
        app: vamoscozinharapi
    spec:
      containers:
        - name: vamoscozinharapi
          image: vamoscozinharapi:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
          envFrom:
            - configMapRef:
                name: vamoscozinharapi-config
            - secretRef:
                name: vamoscozinharapi-secrets
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: vamoscozinharapi-service
  namespace: default
  labels:
    app: vamoscozinharapi
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: vamoscozinharapi

