services:
  db:
    container_name: vamoscozinhar-db
    image: postgres:18.3-alpine3.23
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    networks:
      - vamos-cozinhar-network


  mem_db:
    container_name: vamoscozinhar-mem-db
    image: valkey/valkey:9.0-alpine3.23
    ports:
      - "6379:6379"
    networks:
      - vamos-cozinhar-network

networks:
  vamos-cozinhar-network: